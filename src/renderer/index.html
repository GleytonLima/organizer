<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Bash Organizer</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/topbar.css" />
    <link rel="stylesheet" href="styles/overlays.css" />
    <link rel="stylesheet" href="styles/status.css" />
  </head>
  <body>
    <div id="app" data-layout="left">
      <aside id="sidebar"></aside>
      <main id="main">
        <header id="topbar"></header>
        <div id="cmdbar"></div>
        <div id="terminals">
          <div id="empty" class="empty hidden">
            <p>Nenhum terminal aberto</p>
            <button class="btn primary" id="btn-empty-new">Novo terminal</button>
          </div>
        </div>
        <footer id="statusbar"></footer>
      </main>
    </div>

    <div id="menu" class="menu hidden"></div>
    <div id="modal-backdrop" class="hidden">
      <form id="modal" autocomplete="off"></form>
    </div>

    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
